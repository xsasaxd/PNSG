<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Templates de Mídia — Paróquia Nossa Senhora das Graças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7FC; --surface:#FFFFFF; --surface-2:#EDF1FA;
    --ink:#12162A; --ink-muted:#535A7A; --border:#DBE1F1;
    --shadow: 0 1px 2px rgba(18,22,42,.04), 0 8px 24px rgba(18,22,42,.06);
    --primary-dark:#031273; --primary:#0504AA; --secondary:#2337C6; --accent:#4169E1; --sky:#4CC9F0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0E1E; --surface:#141935; --surface-2:#1B2145;
      --ink:#EDEFFB; --ink-muted:#AEB4DA; --border:#2B3161;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0E1E; --surface:#141935; --surface-2:#1B2145;
    --ink:#EDEFFB; --ink-muted:#AEB4DA; --border:#2B3161;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Public Sans",ui-sans-serif,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  a{ color:var(--secondary); }

  header{ background:linear-gradient(175deg,var(--primary-dark),var(--primary) 85%); color:#fff; padding:32px 28px; }
  header .wrap{ max-width:1240px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  header .back{ color:#D7DCFA; text-decoration:none; font-size:.85rem; font-weight:600; }
  header .back:hover{ color:#fff; }
  header h1{ font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.5rem; margin:6px 0 0; }
  header p{ margin:6px 0 0; color:#D7DCFA; font-size:.92rem; max-width:60ch; }

  .layout{ max-width:1240px; margin:0 auto; padding:28px; display:grid; grid-template-columns:340px 1fr; gap:24px; align-items:start; }

  .tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .tab{ font-size:.82rem; font-weight:600; padding:9px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); cursor:pointer; }
  .tab.active{ background:var(--primary); border-color:var(--primary); color:#fff; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; box-shadow:var(--shadow); }
  .panel h3{ font-family:"Fraunces",Georgia,serif; font-size:1.05rem; margin:0 0 16px; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.76rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin-bottom:6px; }
  .field input[type="text"], .field textarea{
    width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    font-family:"Public Sans",sans-serif; font-size:.92rem; color:var(--ink); background:var(--bg); resize:vertical;
  }
  .field textarea{ min-height:64px; }

  .upload-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .upload-btn{ display:inline-flex; align-items:center; gap:8px; font-size:.85rem; font-weight:600; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--ink); cursor:pointer; }
  .remove-btn{ font-size:.8rem; color:#D64550; background:none; border:none; cursor:pointer; font-weight:600; padding:4px 0; }
  input[type="file"]{ display:none; }

  .download-btn{
    width:100%; margin-top:6px; padding:14px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(175deg,var(--primary-dark),var(--primary) 85%); color:#fff;
    font-family:"Public Sans",sans-serif; font-weight:700; font-size:.95rem; letter-spacing:.02em;
  }
  .download-btn:hover{ opacity:.92; }

  .preview{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .canvas-wrap{ width:100%; max-width:520px; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--border); background:var(--surface-2); }
  canvas{ width:100%; height:auto; display:block; }
  .dim-label{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.78rem; color:var(--ink-muted); }

  @media (max-width:880px){
    .layout{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <a class="back" href="index.html">← Voltar ao guia de identidade</a>
      <h1>Templates de Mídia</h1>
      <p>Escolha um modelo, troque o texto, envie uma foto de fundo (opcional) e baixe a arte pronta para postar.</p>
    </div>
  </div>
</header>

<div class="layout">
  <div>
    <div class="tabs" id="tabs"></div>

    <div class="panel">
      <h3 id="panel-title">Textos</h3>
      <div id="fields"></div>

      <div class="field">
        <label>Foto de fundo (opcional)</label>
        <div class="upload-row">
          <label class="upload-btn" for="bg-input">Escolher imagem</label>
          <input type="file" id="bg-input" accept="image/*">
          <button class="remove-btn" id="remove-bg" hidden>Remover imagem</button>
        </div>
      </div>

      <button class="download-btn" id="download-btn">Baixar arte (PNG)</button>
    </div>
  </div>

  <div class="preview">
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="dim-label" id="dim-label"></div>
  </div>
</div>

<script>
(function(){
  const COLORS = {
    meiaNoite:'#031273', real:'#0504AA', marinho:'#2337C6', cornflower:'#4169E1', celeste:'#4CC9F0',
    bg:'#F5F7FC', ink:'#12162A', inkMuted:'#535A7A', border:'#DBE1F1', white:'#FFFFFF'
  };

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r);
    ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
  }

  function wrapLines(ctx, text, maxWidth){
    const paragraphs = String(text == null ? '' : text).split('\n');
    const lines = [];
    paragraphs.forEach(p => {
      const words = p.split(' ').filter(w => w.length);
      if (!words.length){ lines.push(''); return; }
      let current = words[0];
      for (let i=1;i<words.length;i++){
        const test = current + ' ' + words[i];
        if (ctx.measureText(test).width <= maxWidth) current = test;
        else { lines.push(current); current = words[i]; }
      }
      lines.push(current);
    });
    return lines.length ? lines : [''];
  }

  function measureBlock(ctx, font, text, maxWidth, lineHeightFactor){
    ctx.font = font;
    const lines = wrapLines(ctx, text, maxWidth);
    const m = font.match(/(\d+(?:\.\d+)?)px/);
    const fontSize = m ? parseFloat(m[1]) : 16;
    const lineHeight = fontSize * lineHeightFactor;
    return { lines, lineHeight, fontSize, height: lines.length * lineHeight, font };
  }

  function drawBlock(ctx, block, x, topY, align, color){
    ctx.font = block.font;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';
    const baseline0 = topY + block.fontSize * 0.86;
    block.lines.forEach((line,i) => ctx.fillText(line, x, baseline0 + i*block.lineHeight));
    return topY + block.height;
  }

  function coverDraw(ctx, img, x, y, w, h){
    const ir = img.width / img.height, r = w / h;
    let sx, sy, sw, sh;
    if (ir > r){ sh = img.height; sw = sh*r; sx = (img.width-sw)/2; sy = 0; }
    else { sw = img.width; sh = sw/r; sx = 0; sy = (img.height-sh)/2; }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function drawBackground(ctx, w, h, img, tone){
    if (img){
      coverDraw(ctx, img, 0, 0, w, h);
      if (tone === 'dark'){
        const g = ctx.createLinearGradient(0,0,0,h);
        g.addColorStop(0,'rgba(3,18,115,0.35)');
        g.addColorStop(1,'rgba(3,18,115,0.82)');
        ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.86)';
        ctx.fillRect(0,0,w,h);
      }
    } else {
      if (tone === 'dark'){
        const g = ctx.createLinearGradient(0,0,0,h);
        g.addColorStop(0, COLORS.meiaNoite); g.addColorStop(0.85, COLORS.real);
        ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      } else {
        ctx.fillStyle = COLORS.bg; ctx.fillRect(0,0,w,h);
      }
    }
  }

  function drawBadge(ctx, cx, cy, r, bg, border){
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle = bg || '#F2F4FF'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = border || '#ffffff'; ctx.stroke();
    ctx.fillStyle = COLORS.meiaNoite;
    ctx.font = "700 " + Math.round(r*0.6) + "px Fraunces, Georgia, serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('NSG', cx, cy+1);
    ctx.restore();
  }

  function pill(ctx, x, y, text, font, bgColor, textColor, align){
    ctx.font = font;
    const padX = 18, h = 40;
    const tw = ctx.measureText(text).width;
    const w = tw + padX*2;
    const drawX = align === 'right' ? x - w : x;
    roundRect(ctx, drawX, y, w, h, h/2);
    ctx.fillStyle = bgColor; ctx.fill();
    ctx.fillStyle = textColor;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(text, drawX+padX, y+h/2+1);
    return { w, h, x: drawX };
  }

  // ---------- Modelo A: Citações ----------
  function drawModeloA(ctx, w, h, s, img){
    drawBackground(ctx, w, h, img, 'dark');
    drawBadge(ctx, 102, 102, 30);

    const maxWidth = w - 240;
    const quote = measureBlock(ctx, "italic 500 46px Fraunces, Georgia, serif", '"' + (s.quote||'') + '"', maxWidth, 1.42);
    const authorText = (s.author||'').toUpperCase();
    const authorH = 16*1.3;
    const crossH = 40, gap1 = 32, gap2 = 32;
    const total = crossH + gap1 + quote.height + gap2 + authorH;
    let y = (h - total) / 2;
    const cx = w/2;

    ctx.strokeStyle = COLORS.celeste; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, y); ctx.lineTo(cx, y+crossH);
    ctx.moveTo(cx-20, y+crossH*0.32); ctx.lineTo(cx+20, y+crossH*0.32);
    ctx.stroke();
    y += crossH + gap1;

    y = drawBlock(ctx, quote, cx, y, 'center', '#ffffff') + gap2;

    ctx.font = "700 16px 'Public Sans', sans-serif";
    ctx.fillStyle = COLORS.celeste;
    ctx.letterSpacing = '2px';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(authorText, cx, y + 14);
    ctx.letterSpacing = '0px';
  }

  // ---------- Modelo B: Avisos ----------
  function drawModeloB(ctx, w, h, s, img){
    drawBackground(ctx, w, h, img, 'light');
    const g = ctx.createLinearGradient(0,0,w,0);
    g.addColorStop(0, COLORS.marinho); g.addColorStop(1, COLORS.cornflower);
    ctx.fillStyle = g; ctx.fillRect(0,0,w,16);
    drawBadge(ctx, w-102, 94, 30, '#ffffff', COLORS.border);

    let y = 150; const x = 96; const maxWidth = w - 192;

    const p = pill(ctx, x, y, (s.badge||'').toUpperCase(), "700 14px 'Public Sans', sans-serif", COLORS.real, '#ffffff', 'left');
    y += p.h + 32;

    const title = measureBlock(ctx, "700 56px Fraunces, Georgia, serif", s.title||'', Math.min(maxWidth,720), 1.15);
    y = drawBlock(ctx, title, x, y, 'left', COLORS.meiaNoite) + 32;

    [s.line1, s.line2].forEach(line => {
      if (!line) return;
      ctx.font = "700 22px 'Public Sans', sans-serif"; ctx.fillStyle = COLORS.cornflower;
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.fillText('•', x, y+24);
      ctx.font = "400 28px 'Public Sans', sans-serif"; ctx.fillStyle = COLORS.ink;
      ctx.fillText(line, x+28, y+24);
      y += 36 + 16;
    });
    y += 16;

    const closing = measureBlock(ctx, "italic 500 30px Fraunces, Georgia, serif", s.closing||'', maxWidth, 1.3);
    drawBlock(ctx, closing, x, y, 'left', COLORS.marinho);
  }

  // ---------- Modelo C: Carrossel ----------
  function drawModeloC(ctx, w, h, s, img){
    drawBackground(ctx, w, h, img, 'dark');
    const inset = 80;

    ctx.font = "700 72px Fraunces, Georgia, serif";
    ctx.fillStyle = '#ffffff'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText(s.number||'01', inset, inset+62);

    pill(ctx, w-inset, inset+16, s.cta||'', "700 14px 'Public Sans', sans-serif", COLORS.marinho, '#ffffff', 'right');

    const title = measureBlock(ctx, "700 52px Fraunces, Georgia, serif", s.title||'', w-inset*2-160, 1.15);
    const subtitle = measureBlock(ctx, "400 26px 'Public Sans', sans-serif", s.subtitle||'', w-inset*2-280, 1.55);
    const gap = 20;
    const bottomY = h - inset;
    const subtitleTopY = bottomY - subtitle.height;
    const titleTopY = subtitleTopY - gap - title.height;

    drawBlock(ctx, title, inset, titleTopY, 'left', '#ffffff');
    drawBlock(ctx, subtitle, inset, subtitleTopY, 'left', '#AEB4DA');
  }

  // ---------- Modelo D: Evangelho ----------
  function drawModeloD(ctx, w, h, s, img){
    drawBackground(ctx, w, h, img, 'light');
    drawBadge(ctx, w-102, 94, 30, COLORS.bg, COLORS.border);

    let y = 150; const x = 96; const maxWidth = w - 192;

    ctx.strokeStyle = COLORS.marinho; ctx.lineWidth = 4; ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+46); ctx.stroke();

    ctx.font = "700 15px 'Public Sans', sans-serif"; ctx.fillStyle = COLORS.real;
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.letterSpacing = '1px';
    ctx.fillText((s.label||'').toUpperCase(), x+20, y+15);
    ctx.letterSpacing = '0px';
    ctx.font = "400 18px 'Public Sans', sans-serif"; ctx.fillStyle = COLORS.inkMuted;
    ctx.fillText(s.reference||'', x+20, y+40);
    y += 46 + 36;

    const verse = measureBlock(ctx, "italic 500 40px Fraunces, Georgia, serif", s.verse||'', maxWidth-80, 1.4);
    const boxH = verse.height + 72;
    roundRect(ctx, x, y, maxWidth, boxH, 12);
    ctx.fillStyle = COLORS.surface2 || '#EDF1FA'; ctx.fill();
    ctx.fillStyle = COLORS.real; ctx.fillRect(x, y, 4, boxH);
    drawBlock(ctx, verse, x+40, y+36, 'left', COLORS.meiaNoite);
    y += boxH + 36;

    const reflection = measureBlock(ctx, "400 26px 'Public Sans', sans-serif", s.reflection||'', maxWidth-40, 1.65);
    drawBlock(ctx, reflection, x, y, 'left', COLORS.inkMuted);
  }
  COLORS.surface2 = '#EDF1FA';

  // ---------- Stories / Reels ----------
  function drawStories(ctx, w, h, s, img){
    drawBackground(ctx, w, h, img, 'dark');

    const contentX = 64, contentTop = 250, contentW = w - 128, contentBottom = h - 250;

    drawBadge(ctx, contentX+46, contentTop+46, 46);
    pill(ctx, contentX+contentW, contentTop+26, (s.tag||'').toUpperCase(), "700 14px 'Public Sans', sans-serif", 'rgba(255,255,255,0.14)', '#4CC9F0', 'right');

    const innerMax = contentW - 64;
    const script = measureBlock(ctx, "400 40px 'Alex Brush', cursive", s.script||'', innerMax, 1.0);
    const headline = measureBlock(ctx, "700 52px Fraunces, Georgia, serif", s.headline||'', innerMax, 1.08);
    const subtext = measureBlock(ctx, "400 22px 'Public Sans', sans-serif", s.subtext||'', innerMax, 1.5);
    const cta = { height: 30 };
    const handle = { height: 20*1.3 };
    const gap = 18;
    const padTop = 44, padBottom = 32;

    const innerHeight = script.height + gap + headline.height + gap + subtext.height + gap + 9 + gap + cta.height + gap + handle.height;
    const scrimHeight = innerHeight + padTop + padBottom;
    const scrimTop = contentBottom - scrimHeight;

    const g = ctx.createLinearGradient(0, scrimTop, 0, contentBottom);
    g.addColorStop(0, 'rgba(3,18,115,0)');
    g.addColorStop(0.45, 'rgba(3,18,115,0.95)');
    ctx.fillStyle = g;
    ctx.fillRect(contentX, scrimTop, contentW, scrimHeight);

    let y = scrimTop + padTop;
    const tx = contentX + 32;
    y = drawBlock(ctx, script, tx, y, 'left', COLORS.celeste) + gap;
    y = drawBlock(ctx, headline, tx, y, 'left', '#ffffff') + gap;
    y = drawBlock(ctx, subtext, tx, y, 'left', 'rgba(255,255,255,0.88)') + gap;

    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tx, y+4); ctx.lineTo(contentX+contentW-32, y+4); ctx.stroke();
    y += 9 + gap;

    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(tx+10, y+20); ctx.lineTo(tx+10, y+2);
    ctx.moveTo(tx+2, y+10); ctx.lineTo(tx+10, y+2); ctx.lineTo(tx+18, y+10);
    ctx.stroke();
    ctx.font = "600 16px 'Public Sans', sans-serif"; ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Deslize para saber mais', tx+30, y+16);
    y += cta.height + gap;

    ctx.font = "600 15px 'Public Sans', sans-serif"; ctx.fillStyle = 'rgba(76,201,240,0.85)';
    ctx.fillText(s.handle||'', tx, y+14);
  }

  const TEMPLATES = {
    modeloA: {
      label: 'Modelo A — Citações', w: 1080, h: 1080, tone: 'dark', draw: drawModeloA,
      fields: [
        {key:'quote', label:'Citação', type:'textarea', default:'A oração é a força do homem e a fraqueza de Deus.'},
        {key:'author', label:'Autor(a)', type:'text', default:'São Agostinho'}
      ]
    },
    modeloB: {
      label: 'Modelo B — Avisos', w: 1080, h: 1080, tone: 'light', draw: drawModeloB,
      fields: [
        {key:'badge', label:'Selo', type:'text', default:'Aviso da Comunidade'},
        {key:'title', label:'Título', type:'textarea', default:'Horários das Missas de Domingo'},
        {key:'line1', label:'Linha 1', type:'text', default:'Manhã: 08h00 e 10h00'},
        {key:'line2', label:'Linha 2', type:'text', default:'Noite: 18h00 e 19h30'},
        {key:'closing', label:'Frase final', type:'text', default:'Venha celebrar conosco!'}
      ]
    },
    modeloC: {
      label: 'Modelo C — Carrossel', w: 1080, h: 1080, tone: 'dark', draw: drawModeloC,
      fields: [
        {key:'number', label:'Número', type:'text', default:'01'},
        {key:'cta', label:'Selo', type:'text', default:'Arraste pro lado →'},
        {key:'title', label:'Título', type:'textarea', default:'O que é a Liturgia do Tempo Comum?'},
        {key:'subtitle', label:'Subtítulo', type:'textarea', default:'Entenda o significado das cores e das leituras diárias na tradição católica.'}
      ]
    },
    modeloD: {
      label: 'Modelo D — Evangelho', w: 1080, h: 1080, tone: 'light', draw: drawModeloD,
      fields: [
        {key:'label', label:'Selo', type:'text', default:'Evangelho do Dia'},
        {key:'reference', label:'Referência', type:'text', default:'João 14, 6'},
        {key:'verse', label:'Versículo', type:'textarea', default:'"Eu sou o Caminho, a Verdade e a Vida."'},
        {key:'reflection', label:'Reflexão', type:'textarea', default:'Jesus nos convida a caminhar com confiança na fé, sabendo que Ele mesmo é quem nos conduz e nos sustenta a cada passo.'}
      ]
    },
    stories: {
      label: 'Stories / Reels', w: 1080, h: 1920, tone: 'dark', draw: drawStories,
      fields: [
        {key:'tag', label:'Selo', type:'text', default:'Comunidade Matriz'},
        {key:'script', label:'Frase de destaque', type:'text', default:'com fé, tudo posso'},
        {key:'headline', label:'Título', type:'textarea', default:'Festa da Padroeira'},
        {key:'subtext', label:'Texto', type:'textarea', default:'Domingo, 14 de setembro · missas às 9h e 19h · procissão e festa depois da celebração.'},
        {key:'handle', label:'Perfil (@)', type:'text', default:'@perfil da comunidade'}
      ]
    }
  };

  const stateByTemplate = {};
  const imageByTemplate = {};
  Object.keys(TEMPLATES).forEach(key => {
    stateByTemplate[key] = {};
    TEMPLATES[key].fields.forEach(f => stateByTemplate[key][f.key] = f.default);
    imageByTemplate[key] = null;
  });

  let currentTemplate = 'modeloA';
  const requested = new URLSearchParams(location.search).get('t');
  if (requested && TEMPLATES[requested]) currentTemplate = requested;
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const tabsEl = document.getElementById('tabs');
  const fieldsEl = document.getElementById('fields');
  const dimLabel = document.getElementById('dim-label');
  const bgInput = document.getElementById('bg-input');
  const removeBgBtn = document.getElementById('remove-bg');

  function draw(){
    const t = TEMPLATES[currentTemplate];
    canvas.width = t.w; canvas.height = t.h;
    ctx.clearRect(0,0,t.w,t.h);
    t.draw(ctx, t.w, t.h, stateByTemplate[currentTemplate], imageByTemplate[currentTemplate]);
    dimLabel.textContent = t.w + ' × ' + t.h + ' px';
  }

  function renderTabs(){
    tabsEl.innerHTML = '';
    Object.keys(TEMPLATES).forEach(key => {
      const b = document.createElement('button');
      b.className = 'tab' + (key === currentTemplate ? ' active' : '');
      b.textContent = TEMPLATES[key].label;
      b.addEventListener('click', () => { currentTemplate = key; renderTabs(); renderFields(); updateRemoveBtn(); draw(); });
      tabsEl.appendChild(b);
    });
  }

  function renderFields(){
    fieldsEl.innerHTML = '';
    TEMPLATES[currentTemplate].fields.forEach(f => {
      const wrap = document.createElement('div');
      wrap.className = 'field';
      const label = document.createElement('label');
      label.textContent = f.label;
      wrap.appendChild(label);
      const input = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
      if (f.type !== 'textarea') input.type = 'text';
      input.value = stateByTemplate[currentTemplate][f.key];
      input.addEventListener('input', () => {
        stateByTemplate[currentTemplate][f.key] = input.value;
        draw();
      });
      wrap.appendChild(input);
      fieldsEl.appendChild(wrap);
    });
  }

  function updateRemoveBtn(){
    removeBgBtn.hidden = !imageByTemplate[currentTemplate];
  }

  bgInput.addEventListener('change', () => {
    const file = bgInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => { imageByTemplate[currentTemplate] = img; updateRemoveBtn(); draw(); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  removeBgBtn.addEventListener('click', () => {
    imageByTemplate[currentTemplate] = null;
    bgInput.value = '';
    updateRemoveBtn();
    draw();
  });

  document.getElementById('download-btn').addEventListener('click', () => {
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'pnsg-' + currentTemplate + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  });

  async function ensureFonts(){
    const specs = [
      "400 16px 'Public Sans'", "700 16px 'Public Sans'",
      "700 16px Fraunces", "italic 500 16px Fraunces",
      "400 16px 'Alex Brush'"
    ];
    await Promise.all(specs.map(s => document.fonts.load(s).catch(() => {})));
    try { await document.fonts.ready; } catch(e){}
  }

  renderTabs();
  renderFields();
  updateRemoveBtn();
  ensureFonts().then(draw);
  draw();
})();
</script>

</body>
</html>
